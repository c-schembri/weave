name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MSVC / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            configure: windows-ci
            preset: ci-debug
            directory: build/windows-ci
          - configuration: Release
            configure: windows-ci
            preset: ci-release
            directory: build/windows-ci
          - configuration: AddressSanitizer
            configure: asan
            preset: asan
            directory: build/asan
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure without benchmarks
        run: cmake --preset ${{ matrix.configure }} -DWEAVE_BUILD_BENCHMARKS=OFF

      - name: Build tests and examples
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --label-exclude benchmark --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/${{ matrix.directory }}/test-results.xml"

      - name: Upload test reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ matrix.preset }}-tests
          path: |
            ${{ matrix.directory }}/test-results.xml
            ${{ matrix.directory }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
