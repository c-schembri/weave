name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MSVC / ${{ matrix.configuration }}
    runs-on: windows-2022
    # Cold OpenSSL/ICU builds share this budget with the full correctness/package suite.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            configure: windows-postgres
            preset: postgres-debug
            directory: build/windows-postgres
          - configuration: Release
            configure: windows-postgres
            preset: postgres-release
            directory: build/windows-postgres
          - configuration: AddressSanitizer
            configure: asan-postgres
            preset: asan-postgres
            directory: build/asan-postgres
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check out pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: e182cb4dd2df2ab02f66a1aabd5f35bbdc9522c7
          path: build/vcpkg
          persist-credentials: false

      - name: Cache TLS and PostgreSQL dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/vcpkg/binary-cache
          key: openssl-icu-windows-2022-x64-e182cb4dd2df2ab02f66a1aabd5f35bbdc9522c7-v1

      - name: Bootstrap vcpkg
        run: call build\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install optional TLS and PostgreSQL dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\build\vcpkg\binary-cache,readwrite
        run: |
          python -c "from pathlib import Path; Path('build/vcpkg/binary-cache').mkdir(parents=True, exist_ok=True)"
          build\vcpkg\vcpkg.exe install openssl:x64-windows icu:x64-windows --disable-metrics

      - name: Configure without benchmarks
        run: cmake --preset ${{ matrix.configure }} -DWEAVE_BUILD_BENCHMARKS=OFF -DWEAVE_POSTGRES_BENCHMARKS=OFF -DOPENSSL_ROOT_DIR="%GITHUB_WORKSPACE%/build/vcpkg/installed/x64-windows" -DICU_ROOT="%GITHUB_WORKSPACE%/build/vcpkg/installed/x64-windows"

      - name: Build tests and examples
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --label-exclude benchmark --no-tests=error --output-junit "%GITHUB_WORKSPACE%/${{ matrix.directory }}/test-results.xml"

      - name: Upload test reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ matrix.preset }}-tests
          path: |
            ${{ matrix.directory }}/test-results.xml
            ${{ matrix.directory }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
