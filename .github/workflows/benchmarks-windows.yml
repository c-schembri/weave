name: Windows benchmarks

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'AGENTS.md', '**/README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'AGENTS.md', '**/README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Weave / Asio / Tokio
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Cache comparison dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            build/windows-bench-ci/_deps
            ~/.cargo/registry
            ~/.cargo/git
            build/tokio-ci
          key: windows-bench-v1-rust-1.94.0-${{ hashFiles('CMakeLists.txt', 'modules/tcp/benchmarks/tokio/Cargo.lock', 'modules/tcp/benchmarks/tokio/Cargo.toml', 'modules/tcp/benchmarks/tokio/src/**') }}
          restore-keys: windows-bench-v1-rust-1.94.0-

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Configure only the TCP comparison
        run: cmake --preset windows-bench-ci

      - name: Build native servers and common load generator
        run: cmake --build --preset bench-ci --parallel 4

      - name: Build Tokio server
        run: rustup run 1.94.0 cargo build --release --locked --manifest-path modules/tcp/benchmarks/tokio/Cargo.toml --target-dir build/tokio-ci

      - name: Run fixed paired benchmark (five-minute hard limit)
        run: python scripts/bench_ci.py run --output-directory benchmarks/results/ci

      - name: Upload results and failure diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-benchmarks
          path: benchmarks/results/ci/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Update latest README results
    needs: benchmark
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 3
    permissions:
      contents: write
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out current main (never a PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download this run's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-benchmarks
          path: benchmarks/results/publication

      - name: Validate and publish complete, current-main results
        run: python scripts/bench_ci.py publish --report benchmarks/results/publication/publication.json
